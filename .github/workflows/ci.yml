name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run the real synthetic dataset generator and CNN architecture build
        run: |
          python asl_recognition/dataset.py
          python asl_recognition/model.py
      - name: Run the real search/dedup engine self-test
        run: python search/search_engine.py
